name: Build and Release Cross-Platform

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  release:
    types: [published]

# 创建 Release 需要写 contents 权限（默认 GITHUB_TOKEN 只读，否则 softprops/action-gh-release 报 403）
permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  APP_NAME: 'mi-scale-to-garmin'
  GUI_NAME: 'mi-scale-to-garmin-gui'  # GUI 可执行文件名（与本地 build.py 一致）；发布包名仍用 APP_NAME
jobs:
  build:
    name: Build on ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            arch: arm64
            platform: macos
            artifact_ext: dmg

          # macOS x86_64 (Intel)
          - os: macos-14
            arch: x64
            platform: macos
            artifact_ext: dmg

          # Windows x64
          - os: windows-latest
            arch: x64
            platform: windows
            artifact_ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          # 重构后 requirements.txt 移入 requirements/ 目录，需显式指定 lockfile 路径
          cache-dependency-path: requirements/*.txt

      - name: Cache PyInstaller
        uses: actions/cache@v4
        with:
          path: .pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('**/requirements/gui.txt') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/gui.txt
          pip install -r requirements/build.txt

      - name: Verify PyQt6 installation
        run: |
          python -c "from PyQt6.QtCore import PYQT_VERSION_STR; print(f'PyQt6 version: {PYQT_VERSION_STR}')"
          python -c "import PyInstaller; print(f'PyInstaller version: {PyInstaller.__version__}')"

      - name: Extract version
        id: version
        shell: bash  # 必须指定 bash 才能使用 ${VAR#prefix} 语法
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

      # 构建参数单一来源：packaging/build.py（与本地构建完全一致）
      # GUI 默认 onefile 单文件，产物输出到 dist/dev/<platform>/<name>.exe / <name>（macOS 无后缀）
      - name: Build with PyInstaller
        run: python packaging/build.py gui

      - name: Create DMG (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install create-dmg
          # onefile 产物是单个可执行文件（非 .app bundle），create-dmg 需要目录，
          # 故先把单文件放进临时目录再打包
          # 未签名产物首次运行需 Gatekeeper 放行（右键→打开）
          mkdir -p "dmg-staging/${{ env.GUI_NAME }}.app/Contents/MacOS"
          cp "dist/dev/${{ matrix.platform }}/${{ env.GUI_NAME }}" "dmg-staging/${{ env.GUI_NAME }}.app/Contents/MacOS/${{ env.GUI_NAME }}"
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            "${{ env.APP_NAME }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.version.outputs.version }}.${{ matrix.artifact_ext }}" \
            "dmg-staging/${{ env.GUI_NAME }}.app"

      - name: Create ZIP archive (Windows)
        if: matrix.platform == 'windows'
        run: |
          # onefile 单文件直接 zip（用户解压后单 exe 即可运行）
          Compress-Archive -Path "dist\dev\${{ matrix.platform }}\${{ env.GUI_NAME }}.exe" `
            -DestinationPath "${{ env.APP_NAME }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.version.outputs.version }}.${{ matrix.artifact_ext }}"
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            *.${{ matrix.artifact_ext }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.${{ matrix.artifact_ext }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
